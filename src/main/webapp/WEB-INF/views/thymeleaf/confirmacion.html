<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ESTE HTML ESTA ECHO PARA EL EJERCICIO 1 ENTRENAMIENTO 2 -->

    <meta charset="UTF-8">
    <title>Confirmacion</title>

  <!-- Boostrap core css -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}"/>

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
  <a class="navbar-brand" href="#">UNLAM</a>
</nav>

<main role="main" class="container">

  <div class = "container">
    <div id="confirmacion-box" style="margin-top:50px;" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
      <h2>Gracias por contactarnos, <span th:text="${contactoDto.nombre}"></span>!</h2>
      <p>Recibimos tu mensaje:</p>
      <blockquote th:text="${contactoDto.mensaje}"></blockquote>
      <p>Te responderemos pronto al email: <strong th:text="${contactoDto.email}"></strong></p>
    </div>
  </div>
</main>
<!-- /.container -->

<!-- Boostrap core js -->
<script type="text/javascript" th:src="@{webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{js/main.js}"></script>
</body>
</html>
