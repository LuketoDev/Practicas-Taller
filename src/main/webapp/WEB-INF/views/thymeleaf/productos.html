<!DOCTYPE html>
<html lang="en">
<head>

    <!-- ESTE HTML ESTA ECHO PARA EL EJERCICIO 2 ENTRENAMIENTO 2 -->

    <meta charset="UTF-8">
    <title>Productos</title>

    <!-- Boostrap core css -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}"/>

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="#">UNLAM</a>
    </nav>

    <main role="main" class="container">

        <div class = "container">
            <div id="confirmacion-box" style="margin-top:50px;" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">

                <h1>Lista de Productos:</h1>
                <table class="table table-striped">
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th></th>
                    </tr>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.nombre}"></td>
                        <td th:text="'$' + ${producto.precio}"></td>
                        <td><a th:href="@{'/productos/' + ${producto.id}}" id="link-detalle" class="btn btn-lg btn-primary btn-block">Ver Detalle</a></td>
                    </tr>
                </table>

            </div>
        </div>
    </main>
    <!-- /.container -->

    <!-- Boostrap core js -->
    <script type="text/javascript" th:src="@{webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{js/main.js}"></script>
</body>
</html>
