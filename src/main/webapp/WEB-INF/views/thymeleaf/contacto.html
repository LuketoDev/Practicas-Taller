<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ESTE HTML ESTA ECHO PARA EL EJERCICIO 1 ENTRENAMIENTO 2 -->

    <meta charset="UTF-8">
    <title>Contacto</title>

  <!-- Boostrap core css -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}"/>

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
  <a class="navbar-brand" href="#">UNLAM</a>
</nav>

<main role="main" class="container">

  <div class = "container">
    <div id="contacto-box" style="margin-top:50px;" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
      <form action="#" th:action="@{/contacto}" method="POST" th:object="${contactoDto}">
        <h3 class="form-signin-heading">Taller Web I - Entrenamiento 2 - Ejercicio 1</h3>
        <hr class="colorgraph"><br>

        <input th:field="*{nombre}" id="nombre" type="text" class="form-control" placeholder="Ingrese su nombre" required/><br>
        <input th:field="*{email}" type="email" id="email" class="form-control" placeholder="Ingrese su email" required/><br>
        <textarea th:field="*{mensaje}" name="mensaje" id="mensaje" cols="50" rows="5" placeholder="Ingrese un mensaje" required></textarea><br><br>


        <button id="btn-contacto" class="btn btn-lg btn-primary btn-block" Type="Submit">Enviar</button>
      </form>
    </div>
  </div>
</main>
<!-- /.container -->

<!-- Boostrap core js -->
<script type="text/javascript" th:src="@{webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{js/main.js}"></script>
</body>
</html>
